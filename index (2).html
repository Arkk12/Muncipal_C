<!-- Firebase + Google Maps JS -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc, updateDoc, doc, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCiwULO00txSRfKrGDtK0GkxloFe8yjTTo",
  authDomain: "munitrack-185a9.firebaseapp.com",
  projectId: "munitrack-185a9",
  storageBucket: "munitrack-185a9.firebasestorage.app",
  messagingSenderId: "279869593227",
  appId: "1:279869593227:web:55a93f703a7decff0b668e",
  measurementId: "G-M9L7871BTT"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= Google Maps + Geofence ================= */
let map, workerMarkers = {}, geofences = {};
function initWorkersMap() {
  map = new google.maps.Map(document.getElementById("workersMap"), {
    center: { lat: 19.0760, lng: 72.8777 },
    zoom: 15,
  });
  loadWorkerLocations();
  setInterval(loadWorkerLocations, 10000);
}

async function loadWorkerLocations() {
  const snapshot = await getDocs(collection(db, "employees")); // assumes each has location.lat/lng
  snapshot.forEach(docSnap => {
    const data = docSnap.data();
    const workerId = docSnap.id;
    const lat = data.location?.lat || 19.0760;
    const lng = data.location?.lng || 72.8777;
    const pos = { lat, lng };

    // remove old
    if(workerMarkers[workerId]) workerMarkers[workerId].setMap(null);
    if(geofences[workerId]) geofences[workerId].setMap(null);

    workerMarkers[workerId] = new google.maps.Marker({
      map, position: pos, title: data.fullName
    });

    geofences[workerId] = new google.maps.Circle({
      map,
      center: pos,
      radius: 100,
      fillColor: "#FF0000",
      fillOpacity: 0.2,
      strokeColor: "#FF0000",
      strokeWeight: 2,
    });
  });
}

function isInsideGeofence(workerId, lat, lng) {
  const point = new google.maps.LatLng(lat, lng);
  return google.maps.geometry.spherical.computeDistanceBetween(point, geofences[workerId].getCenter()) <= geofences[workerId].getRadius();
}

document.addEventListener('DOMContentLoaded', initWorkersMap);

/* ================= Load Complaints ================= */
async function loadComplaints() {
  const tbody = document.getElementById('complaintsTableBody');
  tbody.innerHTML = `<tr><td colspan="8" class="py-20 text-center"><i class="fas fa-spinner fa-spin text-4xl"></i></td></tr>`;
  try {
    const q = query(collection(db, "complaints"), orderBy("date","desc"));
    const snapshot = await getDocs(q);
    tbody.innerHTML = '';
    snapshot.forEach(docSnap => {
      const data = docSnap.data();
      const assigned = data.assignedWorkerName || data.assignedTo || "Not Assigned";
      let statusHTML = data.status === 'pending' ? `<span class="bg-yellow-100 text-yellow-700 px-5 py-1 rounded-full text-xs">Pending</span>` :
                       data.status === 'in-progress' ? `<span class="bg-blue-100 text-blue-700 px-5 py-1 rounded-full text-xs">In Progress</span>` :
                       `<span class="bg-green-100 text-green-700 px-5 py-1 rounded-full text-xs">Resolved</span>`;
      tbody.innerHTML += `<tr>
        <td class="py-4 px-6">${data.complaintId||'N/A'}</td>
        <td class="py-4 px-6">${data.fullName}</td>
        <td class="py-4 px-6">${data.category}</td>
        <td class="py-4 px-6">${statusHTML}</td>
        <td class="py-4 px-6">${assigned}</td>
        <td class="py-4 px-6">${data.date?new Date(data.date).toLocaleDateString('en-IN'):'—'}</td>
        <td class="py-4 px-6"><a href="https://www.google.com/maps?q=${data.location?.lat||17.53},${data.location?.lng||73.52}" target="_blank" class="text-blue-600">View Map</a></td>
        <td class="py-4 px-6">
          <button onclick="updateStatus('${docSnap.id}','resolved')" class="bg-green-600 text-white text-xs px-4 py-1 rounded-lg">Resolve</button>
        </td>
      </tr>`;
    });
  } catch(e){ console.error(e); }
}
window.updateStatus = async(docId,newStatus)=>{ await updateDoc(doc(db,"complaints",docId),{status:newStatus}); loadComplaints(); };
document.addEventListener('DOMContentLoaded', loadComplaints);

</script>
