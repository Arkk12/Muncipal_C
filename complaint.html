{% extends "base.html" %}
{% block content %}
<h2>File New Complaint</h2>
<form method="POST" enctype="multipart/form-data">
    <div class="mb-3">
        <label>Title</label>
        <input type="text" name="title" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Description</label>
        <textarea name="description" class="form-control" required></textarea>
    </div>
    <div class="mb-3">
        <label>Location</label>
        <input type="text" name="location" class="form-control" placeholder="e.g. Near ABC School, Pune" required>
    </div>
    <div class="mb-3">
        <label>Before Photo (Pothole)</label>
        <input type="file" name="before_photo" class="form-control" accept="image/*" required>
    </div>
    <button type="submit" class="btn btn-primary">Submit Complaint</button>
</form>
{% endblock %}
